# Gastinel Memory & Performance tuning for 8GB RAM Alpine Linux
# Preserves RAM for user applications, prevents aggressive swap stalls

# Reduce swappiness (default 60 is too aggressive on laptops)
vm.swappiness = 10

# Keep filesystem metadata caches in memory for instant responsiveness
vm.vfs_cache_pressure = 50

# Smooth out background writebacks to SSD/NVMe
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
