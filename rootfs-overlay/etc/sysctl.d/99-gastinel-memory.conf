# Gastinel Memory & Performance tuning for Intel Core Ultra 5 (8GB LPDDR5x 8733 MT/s)
# Optimisé pour l'exécution d'IA locale 2B, la compilation et le multitâche intensif.

# Priorité maximale à la compression en RAM (zram) avant tout accès disque NVMe
# Sous zram, un swappiness élevé (180-200) est la recommandation officielle Linux
vm.swappiness = 180

# Désactive le readahead groupé (swap en pages uniques 4 Ko sans latence, idéal pour LPDDR5x)
vm.page-cluster = 0

# Prévient les freezes de la machine lors des allocations de gros tenseurs mémoire par les LLM
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Conserve les métadonnées de fichiers et les chemins d'accès en cache pour un bureau instantané
vm.vfs_cache_pressure = 50

# Écritures asynchrones lissées sur le SSD pour éviter tout stuttering lors des builds
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Allocation mémoire prédictive pour applications basse latence (Vulkan & llama.cpp)
vm.compaction_proactiveness = 20
