[workspace]
resolver = "2"
members = [
    "crates/gastinel-core",
    "crates/gastinel-simd",
    "crates/gastinel-vulkan",
    "crates/gastinel-shell",
    "crates/gastinel-platform",
    "gastinel-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gastinel Project"]
license = "GPL-3.0-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
